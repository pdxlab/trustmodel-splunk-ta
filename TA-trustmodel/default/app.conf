#
# TA-trustmodel — TrustModel AI Assurance Add-on for Splunk
# https://trustmodel.ai/splunk
#
# Receives TrustModel events (evaluation, guardrail, shadow_ai, redteam,
# datascan) via HTTP Event Collector and maps them to Splunk Common
# Information Model (Alerts, Risk, Inventory) so they light up natively in
# Enterprise Security, Risk-Based Alerting, and Exposure Analytics.
#
# Companion add-on for the Cisco AI Defense + Splunk integration.
#

[install]
is_configured = false
state = enabled
build = 1

[launcher]
version = 0.1.0
description = TrustModel AI Assurance — Trust scoring, compliance, and AI security findings inside Splunk ES / SOAR / Observability. Companion add-on for Cisco AI Defense.
author = TrustModel (Predixtions)

[ui]
is_visible = false
label = TrustModel AI Assurance
docs_check_link = https://trustmodel.ai/splunk

[package]
id = TA-trustmodel
check_for_updates = true

[id]
group = sourcetype
name = TA-trustmodel
version = 0.1.0
