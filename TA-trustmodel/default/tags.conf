#
# CIM datamodel tags. Pairs with eventtypes.conf.
#
# Reference: https://docs.splunk.com/Documentation/CIM/latest/User/Overview
#

# CIM Alerts datamodel — guardrail + redteam findings
[eventtype=trustmodel_alert]
alert = enabled

# CIM Risk datamodel — evaluation + datascan + shadow_ai
[eventtype=trustmodel_risk]
risk = enabled
modify = enabled

# CIM Inventory datamodel — shadow AI discoveries are inventory items
[eventtype=trustmodel_shadow_ai]
inventory = enabled

# Per-sourcetype tag fanout (helps with ES drilldowns)
[eventtype=trustmodel_evaluation]
trustmodel = enabled
ai_eval = enabled

[eventtype=trustmodel_guardrail]
trustmodel = enabled
ai_guardrail = enabled

[eventtype=trustmodel_redteam]
trustmodel = enabled
ai_redteam = enabled

[eventtype=trustmodel_datascan]
trustmodel = enabled
ai_datascan = enabled
