#
# CIM datamodel tags. Pairs with eventtypes.conf.
#
# Reference: https://docs.splunk.com/Documentation/CIM/latest/User/Overview
# Schema source-of-truth: TRUS-785 v1.0 (Confluence).
#

# trustmodel:eval — evaluation lifecycle. Loose CIM Performance.
[eventtype=trustmodel_eval]
trustmodel = enabled
ai_eval = enabled
performance = enabled

# trustmodel:finding — detected risks. Strict CIM Alerts.
[eventtype=trustmodel_finding]
trustmodel = enabled
ai_finding = enabled
alert = enabled
