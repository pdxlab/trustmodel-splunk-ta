#
# Eventtypes for CIM datamodel mapping.
#
# Splunk's CIM datamodels (Alerts, Risk, Inventory) match events by eventtype.
# Pairing eventtype + tags.conf below makes TrustModel events visible in the
# right datamodels with no customer config.
#

[trustmodel_evaluation]
search = sourcetype="trustmodel:evaluation"
description = TrustModel completed evaluation events

[trustmodel_guardrail]
search = sourcetype="trustmodel:guardrail"
description = TrustModel guardrail violation events

[trustmodel_shadow_ai]
search = sourcetype="trustmodel:shadow_ai"
description = TrustModel shadow AI discovery events

[trustmodel_redteam]
search = sourcetype="trustmodel:redteam"
description = TrustModel red-team probe finding events

[trustmodel_datascan]
search = sourcetype="trustmodel:datascan"
description = TrustModel DataScan AI-readiness finding events

# Aggregation eventtypes used by ES correlation searches (DA-ESS-TrustModel)
[trustmodel_alert]
search = sourcetype="trustmodel:guardrail" OR sourcetype="trustmodel:redteam"
description = TrustModel events that should fire CIM Alerts datamodel

[trustmodel_risk]
search = sourcetype="trustmodel:evaluation" OR sourcetype="trustmodel:datascan" OR sourcetype="trustmodel:shadow_ai"
description = TrustModel events that should appear in CIM Risk datamodel
