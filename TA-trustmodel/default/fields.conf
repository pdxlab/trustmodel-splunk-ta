#
# Custom (non-CIM) field declarations.
#
# Splunk auto-extracts everything via KV_MODE=json in props.conf, so most
# fields don't need to be declared here. The fields below benefit from
# explicit indexing for fast filtering on common dashboards.
#

[trust_score]
INDEXED_VALUE = false

[model_id]
INDEXED_VALUE = false

[org_id]
INDEXED_VALUE = false

[framework]
INDEXED_VALUE = false

[evaluation_run_id]
INDEXED_VALUE = false

[probe_id]
INDEXED_VALUE = false

[probe_category]
INDEXED_VALUE = false

[scan_id]
INDEXED_VALUE = false

[dataset_id]
INDEXED_VALUE = false

[ai_readiness_score]
INDEXED_VALUE = false

[discovered_system]
INDEXED_VALUE = false
