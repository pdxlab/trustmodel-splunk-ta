#
# Source-type property declarations for all 5 TrustModel sourcetypes.
#
# Sets KV_MODE=json so Splunk auto-extracts every field in the event body.
# TIME_PREFIX / TIME_FORMAT cover both epoch (HEC `time`) and ISO 8601
# (`completed_at`, `discovered_at`).
#
# CIM mapping is layered on via transforms.conf field aliases.
#

#
# trustmodel:evaluation — completed evaluation events. Maps to CIM Risk.
#
[trustmodel:evaluation]
KV_MODE = json
SHOULD_LINEMERGE = false
NO_BINARY_CHECK = true
TIME_PREFIX = "completed_at"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%S
MAX_TIMESTAMP_LOOKAHEAD = 25
TRUNCATE = 1000000
disabled = false
category = TrustModel
description = TrustModel completed evaluation event (TrustScore + dimension scores)
pulldown_type = true

# Field aliases → CIM Risk
FIELDALIAS-trustmodel_evaluation_risk_object = risk_object AS risk_object
FIELDALIAS-trustmodel_evaluation_risk_object_type = risk_object_type AS risk_object_type
FIELDALIAS-trustmodel_evaluation_calculated_risk_score = calculated_risk_score AS calculated_risk_score
FIELDALIAS-trustmodel_evaluation_risk_score = risk_score AS risk_score

# Eventtype tag for CIM Risk datamodel
EVAL-vendor_product = "TrustModel"

#
# trustmodel:guardrail — blocked / flagged guardrail event. Maps to CIM Alerts.
#
[trustmodel:guardrail]
KV_MODE = json
SHOULD_LINEMERGE = false
NO_BINARY_CHECK = true
TIME_PREFIX = "time"\s*:\s*
TIME_FORMAT = %s.%6N
MAX_TIMESTAMP_LOOKAHEAD = 25
TRUNCATE = 1000000
disabled = false
category = TrustModel
description = TrustModel guardrail violation event
pulldown_type = true

FIELDALIAS-trustmodel_guardrail_signature = signature AS signature
FIELDALIAS-trustmodel_guardrail_severity = severity AS severity
FIELDALIAS-trustmodel_guardrail_category = category AS category
FIELDALIAS-trustmodel_guardrail_action = action AS action
FIELDALIAS-trustmodel_guardrail_src = src AS src
FIELDALIAS-trustmodel_guardrail_dest = dest AS dest

EVAL-vendor_product = "TrustModel"

