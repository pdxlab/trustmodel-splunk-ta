#
# Saved search macros. Used by DA-ESS-TrustModel correlation searches and by
# customer-authored dashboards. Wrapping the index/sourcetype lets customers
# rename the index without rewriting every search.
#

[trustmodel_index]
definition = index=trustmodel
description = Default TrustModel index. Override in local/macros.conf to point at a different index.

[trustmodel_evaluation]
definition = `trustmodel_index` sourcetype="trustmodel:evaluation"
description = All TrustModel evaluation events

[trustmodel_guardrail]
definition = `trustmodel_index` sourcetype="trustmodel:guardrail"
description = All TrustModel guardrail violation events

[trustmodel_shadow_ai]
definition = `trustmodel_index` sourcetype="trustmodel:shadow_ai"
description = All TrustModel shadow AI discoveries

[trustmodel_redteam]
definition = `trustmodel_index` sourcetype="trustmodel:redteam"
description = All TrustModel red-team probe findings

[trustmodel_datascan]
definition = `trustmodel_index` sourcetype="trustmodel:datascan"
description = All TrustModel DataScan findings

[trustmodel_alerts]
definition = `trustmodel_index` (sourcetype="trustmodel:guardrail" OR sourcetype="trustmodel:redteam")
description = All TrustModel events that map to CIM Alerts
