#
# HEC inputs for TrustModel sourcetypes.
#
# Customers do NOT need to edit this file — they create their own HEC token
# via Splunk Web (Settings → Data Inputs → HTTP Event Collector) and paste
# the URL + token into the TrustModel Console.
#
# Each event self-declares its sourcetype (`trustmodel:eval` or
# `trustmodel:finding`); this default exists only as a fallback so events
# without an explicit sourcetype still land in a sane place.
#

[http]
disabled = 0

[http://trustmodel-default]
disabled = 0
index = trustmodel
indexes = trustmodel
sourcetype = trustmodel:eval
description = TrustModel default HEC token (sourcetype set per event)
