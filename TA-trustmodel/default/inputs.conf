#
# HEC inputs for TrustModel sourcetypes.
#
# These declare the canonical TrustModel sourcetypes so that the customer can
# create an HEC token scoped to receive only TrustModel events. Customers do
# NOT need to edit this file — the install README explains how to mint an
# HEC token via Splunk Web (Settings → Data Inputs → HTTP Event Collector).
#

[http]
disabled = 0

# Defaults applied to all trustmodel:* events ingested via HEC.
[http://trustmodel-default]
disabled = 0
index = trustmodel
indexes = trustmodel
sourcetype = trustmodel:evaluation
description = TrustModel default HEC token (sourcetype set per event)
